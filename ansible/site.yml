---
- name: Deploy Tenant Complaint Management System
  hosts: webservers
  become: no

  vars:
    project_dir: "/mnt/c/Users/Mahesh/Desktop/tenant_complaint_management_system"
    compose_file: "{{ project_dir }}/docker-compose.yml"
    docker_image: "tenant-complaint-management-system:latest"

  tasks:

    - name: Check Docker connectivity
      command: docker info
      changed_when: false

    - name: Ensure application directory exists
      file:
        path: "{{ project_dir }}"
        state: directory

    - name: Start Tenant Complaint Management System
      community.docker.docker_compose_v2:
        project_src: "{{ project_dir }}"
        files:
          - docker-compose.yml
        state: present
        pull: missing
      environment:
        APP_IMAGE: "{{ docker_image }}"

    - name: Wait for application to become available
      uri:
        url: "http://localhost:8080/actuator/health"
        status_code: 200
        return_content: yes
      register: health_result
      until: health_result.status == 200
      retries: 12
      delay: 5

    - name: Verify application health
      assert:
        that:
          - "'UP' in health_result.content"
        fail_msg: "Application health check failed."

    - name: Display deployment status
      debug:
        msg: "Tenant Complaint Management System deployed successfully."