version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tenant-complaint-management-system:latest
    container_name: tenant_cms_app
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-tenant_complaints}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root_password}
      - REVIEWER_EMAIL=${REVIEWER_EMAIL:-admin@tenant.com}
      - REVIEWER_PASSWORD=${REVIEWER_PASSWORD:-admin123}
    volumes:
      - complaint_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tenant_cms_network
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: tenant_cms_db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=${DB_NAME:-tenant_complaints}
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD:-root_password}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tenant_cms_network
    restart: unless-stopped

volumes:
  db_data:
  complaint_uploads:

networks:
  tenant_cms_network:
    driver: bridge
