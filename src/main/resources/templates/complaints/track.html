<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Complaint - TenantCMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-brand">&#127970; Tenant<span>CMS</span></a>
    <ul class="navbar-nav">
        <li><a th:href="@{/}">Home</a></li>
        <li><a th:href="@{/complaints/submit}">Submit Complaint</a></li>
        <li><a th:href="@{/complaints/track}" class="active">Track Complaint</a></li>
        <li><a th:href="@{/login}">Reviewer Login</a></li>
    </ul>
</nav>

<div class="container-sm">
    <div class="page-header" style="margin-top:1rem;">
        <h1>&#128269; Track Your Complaint</h1>
        <p>Enter your complaint reference ID and registered email to check the status.</p>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card">
        <div class="card-header">Complaint Lookup</div>
        <div class="card-body">
            <form th:action="@{/complaints/track}" th:object="${trackDTO}" method="post">
                <div class="form-group">
                    <label for="referenceId">Reference ID <span class="required">*</span></label>
                    <input type="text" id="referenceId" th:field="*{referenceId}" class="form-control"
                           th:classappend="${#fields.hasErrors('referenceId')} ? 'error' : ''"
                           placeholder="e.g., COMP-20261006-00001" style="text-transform:uppercase;">
                    <div th:if="${#fields.hasErrors('referenceId')}" class="form-error" th:errors="*{referenceId}"></div>
                </div>

                <div class="form-group">
                    <label for="trackEmail">Email Address <span class="required">*</span></label>
                    <input type="email" id="trackEmail" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'error' : ''"
                           placeholder="Email used during complaint submission">
                    <div th:if="${#fields.hasErrors('email')}" class="form-error" th:errors="*{email}"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg">&#128269; Track Complaint</button>
            </form>
        </div>
    </div>
</div>

<footer class="footer">
    <p>&copy; 2026 Tenant Complaint Management System.</p>
</footer>

</body>
</html>
