<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reviewer Login - TenantCMS</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <a href="/" class="navbar-brand">&#127970; Tenant<span>CMS</span></a>
    <ul class="navbar-nav">
        <li><a th:href="@{/}">Home</a></li>
        <li><a th:href="@{/complaints/submit}">Submit Complaint</a></li>
        <li><a th:href="@{/complaints/track}">Track Complaint</a></li>
        <li><a th:href="@{/login}" class="active">Reviewer Login</a></li>
    </ul>
</nav>

<div class="container-sm">
    <div style="text-align:center; margin-bottom:2rem; margin-top:2rem;">
        <h1>&#128274; Reviewer Login</h1>
        <p style="color:var(--text-muted);">Sign in to access the reviewer dashboard</p>
    </div>

    <div class="card">
        <div class="card-body">
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid email or password. Please try again.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                You have been logged out successfully.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Email Address</label>
                    <input type="email" id="username" name="username" class="form-control"
                           placeholder="Enter your email" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                           placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Sign In</button>
            </form>
        </div>
    </div>
</div>

<footer class="footer">
    <p>&copy; 2026 Tenant Complaint Management System.</p>
</footer>

</body>
</html>
